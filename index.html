<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 HTML 실행기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }
    h1 {
      margin: 0 0 22px;
      text-align: center;
      font-size: 28px;
    }
    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }
    input, textarea, button {
      font: inherit;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cfd3da;
      border-radius: 8px;
      background: white;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #666;
    }
    .label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 700;
    }
    textarea {
      width: 100%;
      height: 330px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #cfd3da;
      border-radius: 8px;
      background: #fff;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 10px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }
    #runBtn { background: #222; color: #fff; }
    #downloadBtn { background: #e9ebef; color: #222; }
    #submitBtn { background: #1a73e8; color: #fff; }
    button:hover { opacity: .85; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      min-height: 20px;
      margin: 0 0 18px;
      font-size: 14px;
      font-weight: 600;
    }
    .status.ok { color: #1a7f37; }
    .status.err { color: #c0392b; }
    .status.loading { color: #555; }
    .result-title {
      font-weight: 700;
      margin-bottom: 7px;
    }
    iframe {
      display: block;
      width: 100%;
      height: 430px;
      border: 1px solid #cfd3da;
      border-radius: 8px;
      background: white;
    }
    .notice {
      margin-top: 10px;
      color: #666;
      font-size: 13px;
    }
    @media (max-width: 650px) {
      .info { grid-template-columns: 1fr; }
      .buttons { flex-direction: column; }
      button { width: 100%; }
      textarea { height: 280px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>학생 HTML 실행기</h1>

    <section class="info">
      <div class="field">
        <label for="studentId">학번</label>
        <input id="studentId" type="text" placeholder="학번을 입력하세요">
      </div>
      <div class="field">
        <label for="studentName">이름</label>
        <input id="studentName" type="text" placeholder="이름을 입력하세요">
      </div>
    </section>

    <label class="label" for="htmlCode">HTML 코드</label>
    <textarea id="htmlCode" placeholder="HTML 코드를 여기에 입력하세요."></textarea>

    <div class="buttons">
      <button id="runBtn" type="button">▶ 실행하기</button>
      <button id="downloadBtn" type="button">⬇ HTML 다운로드</button>
      <button id="submitBtn" type="button">📤 제출하기</button>
    </div>
    <div id="statusMsg" class="status"></div>

    <div class="result-title">실행 결과</div>
    <iframe id="preview" title="HTML 실행 결과" sandbox="allow-scripts allow-forms"></iframe>
    <div class="notice">입력한 HTML은 서버에 저장하지 않고 이 브라우저에서만 실행됩니다. '제출하기'를 누르면 구글 시트와 구글 드라이브에 기록·저장됩니다.</div>
  </main>

  <script>
    // 구글 Apps Script 웹 앱 URL (최신 배포 URL)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMwN6eF2w6tagtjwjPvoejSJ3mymOpemw27IxOHa39ZpPDsmOZc3ohN_Y7g5pgi-w5CQ/exec";

    const studentId = document.getElementById("studentId");
    const studentName = document.getElementById("studentName");
    const htmlCode = document.getElementById("htmlCode");
    const preview = document.getElementById("preview");
    const runBtn = document.getElementById("runBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    function setStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = "status" + (type ? " " + type : "");
    }

    function buildSafeFilename(id, name) {
      const safeId = id.replace(/[^0-9A-Za-z가-힣_-]/g, "_");
      const safeName = name.replace(/[^0-9A-Za-z가-힣_-]/g, "_");
      return `${safeId}_${safeName}.html`;
    }

    // 표준 base64 인코딩 (Apps Script Utilities.base64Decode 기본값과 호환)
    function encodeHtmlAsBase64(code) {
      const bytes = new TextEncoder().encode(code);
      let binary = "";
      const chunkSize = 0x8000;

      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }

      return btoa(binary); // 표준 base64 (+, /, = 그대로 유지)
    }

    runBtn.addEventListener("click", () => {
      const code = htmlCode.value.trim();

      if (!code) {
        alert("HTML 코드를 입력해주세요.");
        return;
      }

      preview.srcdoc = code;
    });

    downloadBtn.addEventListener("click", () => {
      const id = studentId.value.trim();
      const name = studentName.value.trim();
      const code = htmlCode.value;

      if (!id) {
        alert("학번을 입력해주세요.");
        studentId.focus();
        return;
      }
      if (!name) {
        alert("이름을 입력해주세요.");
        studentName.focus();
        return;
      }
      if (!code.trim()) {
        alert("HTML 코드를 입력해주세요.");
        htmlCode.focus();
        return;
      }

      const filename = buildSafeFilename(id, name);
      const blob = new Blob([code], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    });

    submitBtn.addEventListener("click", async () => {
      const id = studentId.value.trim();
      const name = studentName.value.trim();
      const code = htmlCode.value;

      if (!id) {
        alert("학번을 입력해주세요.");
        studentId.focus();
        return;
      }
      if (!name) {
        alert("이름을 입력해주세요.");
        studentName.focus();
        return;
      }
      if (!code.trim()) {
        alert("제출할 HTML 코드가 없습니다.");
        htmlCode.focus();
        return;
      }

      const filename = buildSafeFilename(id, name);
      const fileData = encodeHtmlAsBase64(code);

      submitBtn.disabled = true;
      runBtn.disabled = true;
      downloadBtn.disabled = true;
      setStatus(`제출 중: ${id} / ${name} / ${filename}`, "loading");

      try {
        const payload = JSON.stringify({
          studentId: id,
          studentName: name,
          filename: filename,
          fileData: fileData
        });

        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: payload
        });

        setStatus(`✅ 제출이 완료되었습니다. (구글 시트/드라이브에 기록됨) — ${id} / ${name} / ${filename}`, "ok");
      } catch (error) {
        console.error(error);
        setStatus("❌ 제출 중 오류가 발생했습니다. 인터넷 연결을 확인하세요.", "err");
      } finally {
        submitBtn.disabled = false;
        runBtn.disabled = false;
        downloadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>


</body>
</html>
