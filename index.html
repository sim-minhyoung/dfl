<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금요일 귀가 카운트다운</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont,
            "Segoe UI", Roboto, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #1e1e2f, #111119);
        color: #fff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 40px 30px;
        width: 100%;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .title {
        font-size: 1.25rem;
        color: #a0a0b8;
        margin-bottom: 8px;
        font-weight: 500;
    }

    .target-time {
        font-size: 0.95rem;
        color: #ffbd59;
        margin-bottom: 30px;
        font-weight: 600;
    }

    .timer-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 30px;
    }

    .time-box {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 16px;
        padding: 16px 8px;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .number {
        font-size: 2rem;
        font-weight: 700;
        color: #4facfe;
        margin-bottom: 4px;
        font-variant-numeric: tabular-nums;
    }

    .label {
        font-size: 0.75rem;
        color: #71718a;
    }

    .progress-container {
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        height: 10px;
        overflow: hidden;
        margin-bottom: 12px;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(
            90deg,
            #4facfe 0%,
            #00f2fe 100%
        );
        border-radius: 10px;
        transition: width 0.5s linear;
    }

    .progress-text {
        font-size: 0.85rem;
        color: #8f8fbf;
    }

    .message {
        display: none;
        font-size: 1.8rem;
        font-weight: 700;
        color: #00f2fe;
        line-height: 1.5;
        padding: 20px 0;
    }

    .sub-message {
        font-size: 0.95rem;
        color: #a0a0b8;
        margin-top: 12px;
        font-weight: 400;
    }

    @media (max-width: 400px) {
        .card {
            padding: 30px 18px;
        }

        .timer-grid {
            gap: 7px;
        }

        .number {
            font-size: 1.6rem;
        }

        .label {
            font-size: 0.7rem;
        }
    }
</style>


</head>

<body>

<div class="card">


<div id="active-ui">

    <div class="title">
        🏠 금요일 집 가는 날까지
    </div>

    <div class="target-time" id="target-date-display">
        목표: 계산 중...
    </div>

    <div class="timer-grid">

        <div class="time-box">
            <div class="number" id="days">00</div>
            <div class="label">일</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">00</div>
            <div class="label">시간</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">00</div>
            <div class="label">분</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">초</div>
        </div>

    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="progress-text" id="progress-text">
        이번 주 기숙사 생활 버틴 정도 계산 중...
    </div>

</div>

<div class="message" id="complete-message">

    🥳 귀가 시간입니다!

    <div class="sub-message">
        집에 가서 맛있는 거 먹고<br>
        푹 쉬세요! 🏠❤️
    </div>

</div>


</div>

<script>

    /*
     * 금요일 16:00을 기준으로 다음 목표 시간을 계산합니다.
     *
     * 금요일 16시 이전
     * → 오늘 금요일 16시
     *
     * 금요일 16시 이후
     * → 다음 주 금요일 16시
     *
     * 토/일
     * → 다음 주 금요일 16시
     */

    function getTargetFriday(now) {

        const target = new Date(now);

        const day = now.getDay();
        const currentHour = now.getHours();

        // 금요일
        if (day === 5) {

            // 금요일 16시 이전
            if (currentHour < 16) {

                target.setHours(16, 0, 0, 0);

                return target;
            }

            // 금요일 16시 이후 → 다음 주
            target.setDate(target.getDate() + 7);
            target.setHours(16, 0, 0, 0);

            return target;
        }

        // 월~목
        let daysUntilFriday = (5 - day + 7) % 7;

        target.setDate(
            target.getDate() + daysUntilFriday
        );

        target.setHours(16, 0, 0, 0);

        return target;
    }


    /*
     * 목표 금요일의 월요일 09:00을 계산합니다.
     */

    function getMonday9AM(targetFriday) {

        const monday = new Date(targetFriday);

        monday.setDate(
            monday.getDate() - 4
        );

        monday.setHours(9, 0, 0, 0);

        return monday;
    }


    /*
     * 날짜 표시
     */

    function formatTargetDate(target) {

        const month = target.getMonth() + 1;
        const date = target.getDate();

        return `목표: ${month}월 ${date}일(금) 16:00`;
    }


    /*
     * 메인 타이머
     */

    function updateTimer() {

        const now = new Date();

        const target = getTargetFriday(now);

        const diff = target.getTime() - now.getTime();


        // --------------------------------
        // 남은 시간 계산
        // --------------------------------

        const days =
            Math.floor(
                diff / (1000 * 60 * 60 * 24)
            );

        const hours =
            Math.floor(
                (diff / (1000 * 60 * 60)) % 24
            );

        const minutes =
            Math.floor(
                (diff / (1000 * 60)) % 60
            );

        const seconds =
            Math.floor(
                (diff / 1000) % 60
            );


        // --------------------------------
        // 화면 표시
        // --------------------------------

        document.getElementById("days").textContent =
            String(days).padStart(2, "0");

        document.getElementById("hours").textContent =
            String(hours).padStart(2, "0");

        document.getElementById("minutes").textContent =
            String(minutes).padStart(2, "0");

        document.getElementById("seconds").textContent =
            String(seconds).padStart(2, "0");


        // 목표 날짜

        document.getElementById(
            "target-date-display"
        ).textContent = formatTargetDate(target);


        // --------------------------------
        // 이번 주 진행률
        // --------------------------------

        const monday = getMonday9AM(target);

        const totalTime =
            target.getTime() - monday.getTime();

        const elapsedTime =
            now.getTime() - monday.getTime();


        let progress =
            (elapsedTime / totalTime) * 100;


        // 0~100% 범위로 제한

        progress =
            Math.max(
                0,
                Math.min(100, progress)
            );


        document.getElementById(
            "progress-bar"
        ).style.width = `${progress}%`;


        document.getElementById(
            "progress-text"
        ).textContent =
            `이번 주 귀가까지 ${progress.toFixed(1)}% 달성!`;
    }


    /*
     * 초기 실행
     */

    updateTimer();


    /*
     * 1초마다 갱신
     */

    setInterval(
        updateTimer,
        1000
    );

</script>

</body>
</html>
